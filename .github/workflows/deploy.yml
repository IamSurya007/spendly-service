name: CI/CD Pipeline - Oracle Cloud VM

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build NestJS Application
        run: npm run build

  deploy-to-oracle-vm:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Oracle Cloud VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          port: ${{ secrets.ORACLE_VM_PORT || 22 }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && source "$HOME/.profile" || true
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc" || true
            export PATH=$PATH:/usr/local/bin:/usr/bin:$NVM_DIR/versions/node/$(ls $NVM_DIR/versions/node 2>/dev/null | tail -n 1)/bin
            
            APP_DIR="${{ secrets.ORACLE_VM_APP_DIR || '/home/ubuntu/spendly-service' }}"
            
            echo "Pulling latest code on Oracle Cloud VM..."
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/master
            
            echo "Installing dependencies & building..."
            npm install
            npm run build
            
            echo "Reloading application with PM2..."
            pm2 reload spendly-api --update-env || pm2 start dist/main.js --name spendly-api
            pm2 save
            
            echo "Deployment completed successfully!"
